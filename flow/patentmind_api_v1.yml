openapi: 3.0.3
info:
  title: PatentMind AI API
  version: "1.0.0"
  description: >
    R&D 엔지니어를 위한 AI 특허 스크리닝 플랫폼 PatentMind AI의 MVP API 명세서.
    기획서 v1.4 §2~§5, 데이터 모델(users/searches/patents/search_results/sync_logs)과
    실제 프런트엔드(src/api.js, src/App.vue) 호출부에 1:1로 대응한다.
servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버 (BFF, 프런트엔드 VITE_API_BASE_URL과 동일)

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: searches
  - name: search-results
  - name: trends
  - name: admin

paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: 로그인 (MVP는 목업 인증)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/searches:
    get:
      tags: [searches]
      summary: 내 검색 이력 목록 조회 (대시보드 / 내 작업공간)
      responses:
        "200":
          description: 검색 이력 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchSummary"
    post:
      tags: [searches]
      summary: 신규 특허 검색 요청 생성 (4단계 스마트 선별 엔진 트리거)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchCreateRequest"
      responses:
        "201":
          description: 검색 요청 생성됨 (비동기 처리 시작, status=processing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchSummary"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/searches/expand:
    post:
      tags: [searches]
      summary: AI 키워드 확장 (동의어·영문 변형어·IPC/CPC 코드 추천)
      description: >
        기획서 §2.1 "키워드 확장" 항목. 결과는 저장하지 않는 무상태(stateless) 응답이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
      responses:
        "200":
          description: 추천 동의어/코드 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryExpansion"

  /api/searches/{id}/status:
    get:
      tags: [searches]
      summary: 검색 처리 진행 상태 조회 (processing 화면 폴링용)
      parameters:
        - $ref: "#/components/parameters/SearchId"
      responses:
        "200":
          description: 처리 진행률
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  progress:
                    type: integer
                    minimum: 0
                    maximum: 100
                  step:
                    type: integer
                    description: "0~4, Step0~4 선별 퍼널 단계(§3.1)"
                  status:
                    type: string
                    enum: [processing, completed, failed]

  /api/searches/{id}/results:
    get:
      tags: [searches]
      summary: 검색 결과(4-Tier 매트릭스) 목록 조회
      parameters:
        - $ref: "#/components/parameters/SearchId"
        - name: tier
          in: query
          schema:
            type: string
            enum: [All, Core, Major, Reference, Noise]
      responses:
        "200":
          description: 결과 목록 (Tier 필터 적용됨)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResultSummary"

  /api/search-results/{resultId}:
    get:
      tags: [search-results]
      summary: 특허 상세 분석 조회 (정량 5대 지표 + 정성 평가 + 청구항 요약)
      parameters:
        - $ref: "#/components/parameters/ResultId"
      responses:
        "200":
          description: 특허 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/search-results/{resultId}/confirm-tag:
    patch:
      tags: [search-results]
      summary: "\"확인 필요\" 태그 토글 및 메모 저장"
      parameters:
        - $ref: "#/components/parameters/ResultId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmNeeded:
                  type: boolean
                note:
                  type: string
      responses:
        "200":
          description: 저장 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /api/trends/applicant-trend:
    get:
      tags: [trends]
      summary: 연도별/출원인별 출원 추이 (매크로 트렌드 §2.2)
      responses:
        "200":
          description: 연도별 출원 건수
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    year:
                      type: integer
                    value:
                      type: integer

  /api/trends/whitespace-heatmap:
    get:
      tags: [trends]
      summary: 기술 공백지(White Space) 히트맵 (§2.2)
      responses:
        "200":
          description: "부품/공정 축 x 경쟁사 축 밀도 행렬"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: integer
                    description: 0~9, 값이 클수록 특허 밀집도(집중도)가 높음

  /api/admin/sync-logs:
    get:
      tags: [admin]
      summary: 외부 데이터 파이프라인 동기화 로그 (관리자 콘솔, §5.1)
      description: 정량 스코어링 가중치 조정 API는 제공하지 않는다(기획서 v1.4 §3.5 결정 사항).
      responses:
        "200":
          description: 소스별 최근 동기화 상태
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncLog"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SearchId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ResultId:
      name: resultId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: 잘못된 요청
    Unauthorized:
      description: 인증 실패
    NotFound:
      description: 대상을 찾을 수 없음

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [engineer, ip_team, pm, admin]
          description: "MVP 화면은 engineer/admin만 사용, 나머지는 Phase 3용 스키마 여지(§3.5)"

    SearchCreateRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: 자연어 기술 스펙 입력
        period:
          type: string
          enum: ["최근 3년", "최근 5년", "최근 10년", "직접 설정"]
          default: "최근 5년"
        periodFrom:
          type: string
          format: date
          description: period가 "직접 설정"일 때만 사용
        periodTo:
          type: string
          format: date
        excludeExpired:
          type: boolean
          default: true
          description: 소멸·포기 특허 제외 옵션
        countries:
          type: array
          description: "IP5 국가 코드 다중 선택. DB에는 searches.countries text[] 컬럼으로 저장(정규화 테이블 대신 배열 컬럼 채택, v1 데이터모델 결정)"
          items:
            type: string
            enum: [KR, US, EP, JP, CN]
          default: [KR, US, EP, JP, CN]
        company:
          type: string
          description: 대상 출원인(Assignee) 프리셋

    SearchSummary:
      type: object
      properties:
        id:
          type: string
          example: PM-2408
        query:
          type: string
        status:
          type: string
          enum: [완료, 진행중]
        createdAt:
          type: string
        count:
          type: integer
          description: 총 특허 결과 수
        core:
          type: integer
          description: Core 등급 건수
        major:
          type: integer
          description: Major 등급 건수

    QueryExpansion:
      type: object
      properties:
        synonyms:
          type: array
          items:
            type: string
        ipcCodes:
          type: array
          items:
            type: string

    ResultSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        assignee:
          type: string
        year:
          type: integer
        tier:
          type: string
          enum: [Core, Major, Reference, Noise]
        score:
          type: integer
          description: quant_score, 정량 5대 지표 합산 (0~100)
        confidence:
          type: string
          enum: ["상", "중", "하"]
          description: overlap_level(로드맵·스펙 중첩도)의 축약 표기
        abstract:
          type: string

    MetricBreakdown:
      type: object
      properties:
        label:
          type: string
          enum: ["패밀리 크기", "피인용 횟수", "청구항 수·범위", "분쟁·심판 이력", "권리 유효성"]
        score:
          type: integer
        max:
          type: integer
          description: "지표별 배점 상한 (25/25/15/20/15, §3.2)"

    ResultDetail:
      allOf:
        - $ref: "#/components/schemas/ResultSummary"
        - type: object
          properties:
            claim:
              type: string
              description: 독립 청구항 간단 요약
            metrics:
              type: array
              items:
                $ref: "#/components/schemas/MetricBreakdown"
            designDifficulty:
              type: string
              enum: ["상", "중", "하"]
              description: design_difficulty_level, 회피설계 난이도(§3.3)
            confirmNeeded:
              type: boolean
            note:
              type: string

    SyncLog:
      type: object
      properties:
        source:
          type: string
          enum: [KIPRIS, Google Patents, USPTO]
        time:
          type: string
        status:
          type: string
          enum: ["완료", "진행 중", "실패"]
        records:
          type: string
